<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>时光相册</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📷</text></svg>">
<script src="https://fastly.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
<style>
/* ===== 基础重置 ===== */
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: #0a0a0f;
  color: #eee;
  font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  overflow-x: hidden;
  min-height: 100vh;
  cursor: none;
}

/* ===== 自定义鼠标（金黄色五角星） ===== */
.custom-cursor {
  position: fixed;
  width: 40px;
  height: 40px;
  background: transparent;
  pointer-events: none;
  z-index: 99999;
  transform: translate(-50%, -50%);
  transition: transform .2s;
  clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
}
.custom-cursor-dot {
  position: fixed;
  width: 16px;
  height: 16px;
  background: #ffd700;
  pointer-events: none;
  z-index: 99999;
  transform: translate(-50%, -50%);
  clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
}
.custom-cursor.hover {
  transform: translate(-50%, -50%) scale(1.35);
  background: rgba(255,215,0,0.2);
}
@media (hover: none) {
  body { cursor: auto; }
  .custom-cursor, .custom-cursor-dot { display: none; }
}

/* ===== 全屏星星背景 ===== */
#stars {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  z-index: 0;
  pointer-events: none;
}

/* ===== 页面标题 ===== */
.page-header {
  position: relative;
  z-index: 1;
  text-align: center;
  padding: 40px 20px 24px;
}
.page-header h1 {
  font-size: 32px;
  font-weight: 700;
  letter-spacing: 8px;
  color: #f0e6d0;
}
.page-header p {
  font-size: 14px;
  color: #777;
  letter-spacing: 3px;
  margin-top: 8px;
}

/* ===== 轮播图 ===== */
.carousel-wrap {
  position: relative;
  z-index: 1;
  max-width: 900px;
  margin: 0 auto;
  padding: 0 20px;
}
.carousel {
  position: relative;
  width: 100%;
  height: 340px;
  border-radius: 16px;
  overflow: hidden;
  border: 1px solid rgba(201, 169, 110, 0.35);
  box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 40px rgba(201,169,110,0.08);
}
.carousel-slide {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  transition: opacity 0.6s ease;
}

/* 左右箭头 */
.arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: rgba(0,0,0,0.45);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(201,169,110,0.3);
  color: #e8d5a8;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 10;
  font-size: 18px;
  transition: all .2s;
  user-select: none;
}
.arrow:hover {
  background: rgba(201,169,110,0.25);
  border-color: rgba(201,169,110,0.6);
}
.arrow.prev { left: 32px; }
.arrow.next { right: 32px; }

/* 圆点 */
.carousel-dots {
  position: absolute;
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
  z-index: 5;
}
.dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: rgba(255,255,255,0.35);
  cursor: pointer;
  transition: all .2s;
}
.dot.active { background: #e8d5a8; width: 22px; border-radius: 4px; }

/* ===== 照片墙 ===== */
.wall-section {
  position: relative;
  z-index: 1;
  padding: 50px 40px 20px;
  margin-top: 40px;
}
.wall-title {
  text-align: center;
  font-size: 22px;
  letter-spacing: 4px;
  margin-bottom: 36px;
  color: #aaa;
}

/* 空状态 */
.empty-state {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 280px;
  gap: 20px;
}
.add-btn {
  width: 130px;
  height: 130px;
  border-radius: 50%;
  border: 2px dashed rgba(201,169,110,0.3);
  background: rgba(201,169,110,0.04);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 8px;
  cursor: pointer;
  transition: all .3s ease;
}
.add-btn:hover {
  border-color: rgba(201,169,110,0.6);
  background: rgba(201,169,110,0.1);
  transform: scale(1.05);
}
.add-btn .plus {
  font-size: 38px;
  color: rgba(201,169,110,0.5);
  font-weight: 200;
  line-height: 1;
}
.add-btn .text {
  font-size: 13px;
  color: rgba(201,169,110,0.5);
}
.empty-hint {
  font-size: 14px;
  color: #555;
  letter-spacing: 1px;
}

/* 照片瀑布流 */
.wall-grid {
  columns: 4;
  column-gap: 16px;
  max-width: 1200px;
  margin: 0 auto;
  transform-style: preserve-3d;
  perspective: 1000px;
}
.photo-card {
  break-inside: avoid;
  border-radius: 14px;
  overflow: hidden;
  position: relative;
  margin-bottom: 16px;
  border: 3px solid #b9b7b4;
  box-shadow: 0 15px 35px rgba(0,0,0,0.6);
  transition: box-shadow .3s, transform .1s ease-out, border-color .3s;
  cursor: none;
  animation: popIn .5s ease backwards;
  transform-style: preserve-3d;
  will-change: transform;
}
@keyframes popIn {
  from { opacity: 0; transform: scale(.8) translateY(20px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}
.photo-card:hover {
  border-color: #00bfff;
  box-shadow: 0 25px 50px rgba(0,0,0,0.7), 0 0 30px rgba(0,191,255,0.4);
}
.photo-card img {
  width: 100%;
  height: auto;
  display: block;
}
.photo-label {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  padding: 24px 14px 12px;
  background: linear-gradient(transparent, rgba(0,0,0,0.75));
  font-size: 13px;
  color: #ccc;
}
.photo-delete {
  position: absolute;
  top: 8px; right: 8px;
  width: 28px; height: 28px;
  border-radius: 50%;
  background: rgba(0,0,0,0.6);
  color: #fff;
  border: none;
  font-size: 16px;
  line-height: 1;
  cursor: none;
  opacity: 0;
  transition: opacity .2s, background .2s;
  display: flex;
  align-items: center;
  justify-content: center;
}
.photo-card:hover .photo-delete { opacity: 1; }
.photo-delete:hover { background: rgba(220,50,50,0.9); }

/* 删除确认弹窗 */
.confirm-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 10000;
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(4px);
}
.confirm-box {
  background: #1a1a24;
  border: 1px solid rgba(201,169,110,0.3);
  border-radius: 14px;
  padding: 30px 36px;
  text-align: center;
  max-width: 340px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}
.confirm-box h3 { font-size: 18px; margin-bottom: 8px; color: #e8d5a8; }
.confirm-box p { font-size: 14px; color: #999; margin-bottom: 24px; }
.confirm-btns { display: flex; gap: 12px; justify-content: center; }
.confirm-btns button {
  padding: 8px 28px;
  border-radius: 20px;
  border: none;
  font-size: 14px;
  cursor: none;
  transition: all .2s;
}
.confirm-cancel { background: rgba(255,255,255,0.1); color: #ccc; }
.confirm-cancel:hover { background: rgba(255,255,255,0.2); }
.confirm-ok { background: rgba(220,50,50,0.8); color: #fff; }
.confirm-ok:hover { background: rgba(220,50,50,1); }

/* 添加按钮（有照片后显示在右上角） */
.add-small {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 20px;
  border-radius: 20px;
  border: 1px solid rgba(201,169,110,0.4);
  background: rgba(201,169,110,0.08);
  color: #e8d5a8;
  font-size: 14px;
  cursor: pointer;
  margin: 0 auto 30px;
  transition: all .2s;
}
.add-small:hover {
  background: rgba(201,169,110,0.18);
}
.wall-header {
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ===== 灯箱 ===== */
.lightbox {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 16px;
}
.lightbox img {
  max-width: 90vw;
  max-height: 80vh;
  border-radius: 8px;
  box-shadow: 0 0 60px rgba(0,0,0,0.8);
}
.lightbox-close {
  position: absolute;
  top: 20px; right: 24px;
  font-size: 32px;
  color: #999;
  cursor: pointer;
  background: none;
  border: none;
}
.lightbox-nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 48px; height: 48px;
  border-radius: 50%;
  background: rgba(255,255,255,0.1);
  border: none;
  color: #fff;
  font-size: 22px;
  cursor: pointer;
}
.lightbox-nav.prev { left: 20px; }
.lightbox-nav.next { right: 20px; }

/* ===== 时光心事 ===== */
.mood-section {
  max-width: 900px;
  margin: 0 auto;
  padding: 20px 16px 120px;
}
.mood-title {
  text-align: center;
  font-size: 22px;
  letter-spacing: 8px;
  color: #b9b7b4;
  margin-bottom: 24px;
}
.mood-form {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(185,183,180,0.2);
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 30px;
}
.mood-form textarea {
  width: 100%;
  min-height: 80px;
  background: transparent;
  border: none;
  outline: none;
  color: #eee;
  font-size: 14px;
  resize: vertical;
  font-family: inherit;
}
.mood-form textarea::placeholder { color: #555; }
.mood-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 12px;
}
.mood-upload {
  display: flex;
  align-items: center;
  gap: 8px;
  color: #888;
  font-size: 13px;
  cursor: none;
}
.mood-submit {
  padding: 8px 24px;
  border-radius: 20px;
  border: 1px solid rgba(185,183,180,0.4);
  background: rgba(185,183,180,0.1);
  color: #ccc;
  font-size: 13px;
  cursor: none;
  transition: all .2s;
}
.mood-submit:hover {
  background: rgba(0,191,255,0.15);
  border-color: #00bfff;
  color: #00bfff;
}
.mood-preview {
  margin-top: 10px;
}
.mood-preview img {
  max-height: 100px;
  border-radius: 8px;
  border: 1px solid rgba(185,183,180,0.3);
}
.mood-list {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.mood-item {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(185,183,180,0.15);
  border-radius: 14px;
  padding: 16px 20px;
}
.mood-item-text {
  font-size: 14px;
  color: #ccc;
  line-height: 1.6;
  margin-bottom: 8px;
  white-space: pre-wrap;
}
.mood-item-img {
  max-width: 200px;
  border-radius: 8px;
  margin-top: 8px;
}
.mood-item-time {
  font-size: 12px;
  color: #555;
  margin-top: 8px;
}
.mood-edit-input {
  width: 100%;
  min-height: 60px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(0,191,255,0.3);
  border-radius: 8px;
  color: #eee;
  padding: 8px;
  font-size: 14px;
  font-family: inherit;
  resize: vertical;
}
.mood-actions {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}
.mood-btn {
  padding: 4px 14px;
  border-radius: 14px;
  border: 1px solid rgba(185,183,180,0.3);
  background: transparent;
  color: #888;
  font-size: 12px;
  cursor: none;
  transition: all .2s;
}
.mood-btn:hover { border-color: #00bfff; color: #00bfff; }
.mood-btn.del:hover { border-color: #ff4444; color: #ff4444; }
.mood-btn.save:hover { border-color: #4caf50; color: #4caf50; }

/* ===== 底部固定栏 ===== */
footer {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: 60px;
  background: rgba(10,10,15,0.9);
  backdrop-filter: blur(12px);
  border-top: 1px solid rgba(201,169,110,0.1);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 30px;
  z-index: 100;
  font-size: 13px;
  color: #666;
  letter-spacing: 2px;
}
footer .deco {
  width: 50px; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(201,169,110,0.3), transparent);
}

/* ===== 隐藏文件选择器 ===== */
input[type="file"] { display: none; }

/* ===== 响应式 ===== */
@media (max-width: 1024px) {
  .wall-grid { columns: 3; column-gap: 14px; }
  .carousel { height: 280px; }
}
@media (max-width: 768px) {
  .wall-grid { columns: 2; column-gap: 12px; }
  .wall-section { padding: 30px 16px 100px; }
  .carousel { height: 220px; }
  .arrow.prev { left: 10px; width: 36px; height: 36px; font-size: 15px; }
  .arrow.next { right: 10px; width: 36px; height: 36px; font-size: 15px; }
  .page-header h1 { font-size: 24px; letter-spacing: 5px; }
}
@media (max-width: 480px) {
  .wall-grid { columns: 2; column-gap: 10px; }
  .carousel { height: 180px; }
}
</style>
</head>
<body>

<!-- 自定义鼠标 -->
<div class="custom-cursor-dot" id="cursorDot"></div>
<div class="custom-cursor" id="cursorRing"></div>

<div id="app">
  <!-- 全屏星星背景 -->
  <canvas id="stars"></canvas>

  <!-- 隐藏的背景音乐 -->
  <audio ref="bgm" loop preload="auto" src="assets/海屿你.mp3"></audio>

  <!-- 页面标题 -->
  <div class="page-header">
    <h1>时光相册</h1>
    <p>记录每一个美好瞬间</p>
  </div>

  <!-- 轮播图 -->
  <div class="carousel-wrap">
    <div class="carousel">
      <div v-for="(img, i) in banners" :key="i" class="carousel-slide"
           :style="{ backgroundImage: `url(${img})`, opacity: i === currentBanner ? 1 : 0 }"></div>
    </div>
    <div class="arrow prev" @click="prevBanner">&#10094;</div>
    <div class="arrow next" @click="nextBanner">&#10095;</div>
    <div class="carousel-dots">
      <div v-for="(b, i) in banners" :key="i" class="dot"
           :class="{ active: i === currentBanner }" @click="goBanner(i)"></div>
    </div>
  </div>

  <!-- 照片墙 -->
  <div class="wall-section">
    <div class="wall-header">
      <div class="wall-title">照 片 墙</div>
      <div style="display:flex;gap:10px">
        <button class="add-small" @click="scrollToMood">时光心事</button>
        <button v-if="photos.length > 0" class="add-small" @click="triggerAdd">+ 添加照片</button>
      </div>
    </div>

    <!-- 空状态 -->
    <div v-if="photos.length === 0" class="empty-state">
      <div class="add-btn" @click="triggerAdd">
        <div class="plus">+</div>
        <div class="text">添加照片</div>
      </div>
      <div class="empty-hint">点击上方按钮，上传你的第一张照片</div>
    </div>

    <!-- 照片网格 -->
    <div v-else class="wall-grid">
      <div v-for="(p, i) in photos" :key="i" class="photo-card"
           :style="{ animationDelay: (i % 4 * 0.08) + 's' }"
           @click="openLightbox(i)">
        <img :src="p.src" :alt="p.name">
        <button class="photo-delete" @click.stop="deletePhoto(i)">&times;</button>
        <div class="photo-label">{{ formatTime(p.createdAt) }}</div>
      </div>
    </div>

    <input ref="fileInput" type="file" accept="image/*" multiple @change="onFiles">
  </div>

  <!-- 灯箱 -->
  <div v-if="lightbox.show" class="lightbox" @click.self="closeLightbox">
    <button class="lightbox-close" @click="closeLightbox">&times;</button>
    <button class="lightbox-nav prev" @click="lightboxPrev">&#10094;</button>
    <img :src="photos[lightbox.index].src" :alt="photos[lightbox.index].name">
    <button class="lightbox-nav next" @click="lightboxNext">&#10095;</button>
  </div>

  <!-- 删除确认弹窗 -->
  <div v-if="confirm.show" class="confirm-overlay" @click.self="confirm.show = false">
    <div class="confirm-box">
      <h3>删除照片</h3>
      <p>确定要删除这张照片吗？删除后无法恢复。</p>
      <div class="confirm-btns">
        <button class="confirm-cancel" @click="confirm.show = false">取消</button>
        <button class="confirm-ok" @click="doDelete">删除</button>
      </div>
    </div>
  </div>

  <!-- 心事图片灯箱 -->
  <div v-if="moodLightbox.show" class="lightbox" @click.self="moodLightbox.show = false">
    <button class="lightbox-close" @click="moodLightbox.show = false">&times;</button>
    <img :src="moodLightbox.src" style="max-width:90%;max-height:90%;border-radius:10px">
  </div>

  <!-- 时光心事 -->
  <div class="mood-section">
    <div class="mood-title">时 光 心 事</div>
    <div class="mood-form">
      <textarea v-model="moodText" placeholder="写下此刻的心事..."></textarea>
      <div class="mood-footer">
        <label class="mood-upload">
          <span>+ 添加图片</span>
          <input type="file" accept="image/*" @change="onMoodImage" style="display:none">
        </label>
        <button class="mood-submit" @click="addMood">发布</button>
      </div>
      <div v-if="moodImage" class="mood-preview">
        <img :src="moodImage" alt="预览">
      </div>
    </div>
    <div class="mood-list">
      <div v-for="(m, i) in moods" :key="i" class="mood-item">
        <div v-if="editingMood !== i" class="mood-item-text">{{ m.text }}</div>
        <textarea v-else v-model="moodEditText" class="mood-edit-input"></textarea>
        <img v-if="m.img && editingMood !== i" :src="m.img" class="mood-item-img" @click="openImgLightbox(m.img)">
        <div v-if="editingMood === i && moodEditImg" class="mood-preview-wrap">
          <img :src="moodEditImg" class="mood-item-img">
        </div>
        <div class="mood-item-time">{{ formatTime(m.createdAt) }}</div>
        <div class="mood-actions">
          <button v-if="editingMood !== i" class="mood-btn" @click="editMood(i)">编辑</button>
          <template v-if="editingMood === i">
            <label class="mood-btn" style="cursor:none">
              改图<input type="file" accept="image/*" @change="onMoodEditImage" style="display:none">
            </label>
            <button class="mood-btn save" @click="saveMood(i)">保存</button>
          </template>
          <button class="mood-btn del" @click="deleteMood(i)">删除</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 底部固定栏 -->
  <footer>
    <div class="deco"></div>
    <span>时光相册</span>
    <div class="deco"></div>
    <div style="margin-top:8px;font-size:12px;opacity:.6" id="uptime"></div>
  </footer>
</div>

<script>
const { createApp } = Vue;

createApp({
  data() {
    return {
      // 轮播图：用户把自己的横幅图放到 assets/ 下命名为 banner-1.jpg ~ banner-7.jpg
      banners: [
        'assets/banner-1.jpg',
        'assets/banner-2.jpg',
        'assets/banner-3.jpg',
        'assets/banner-4.jpg',
        'assets/banner-5.jpg'
      ],
      currentBanner: 0,
      bannerTimer: null,

      // 用户添加的照片
      photos: [],

      // 时光心事
      moodText: '',
      moodImage: '',
      moods: [],
      editingMood: -1,
      moodEditText: '',
      moodEditImg: '',
      moodLightbox: { show: false, src: '' },

      // 灯箱
      lightbox: { show: false, index: 0 },
      confirm: { show: false, index: -1 }
    };
  },
  mounted() {
    this.initStars();
    this.startBannerAuto();
    this.tryPlayBgm();
    this.initDB().then(() => { this.loadPhotos(); this.loadMoods(); });
    this.initCustomCursor();
    this.initTilt();
    this.startUptime();
    window.addEventListener('keydown', e => {
      if (!this.lightbox.show) return;
      if (e.key === 'ArrowLeft') this.lightboxPrev();
      if (e.key === 'ArrowRight') this.lightboxNext();
      if (e.key === 'Escape') this.closeLightbox();
    });
  },
  methods: {
    // ===== 运行时长 =====
    startUptime() {
      const start = new Date('2026-10-24T20:00:00+08:00').getTime();
      const el = document.getElementById('uptime');
      const tick = () => {
        const diff = Date.now() - start;
        const d = Math.floor(diff / 86400000);
        const h = Math.floor(diff % 86400000 / 3600000);
        const m = Math.floor(diff % 3600000 / 60000);
        const s = Math.floor(diff % 60000 / 1000);
        el.textContent = `本网站已运行 ${d}天 ${h}时 ${m}分 ${s}秒`;
      };
      tick();
      setInterval(tick, 1000);
    },
    // ===== 自定义鼠标 =====
    initCustomCursor() {
      const dot = document.getElementById('cursorDot');
      const ring = document.getElementById('cursorRing');
      let mx = 0, my = 0, rx = 0, ry = 0;
      document.addEventListener('mousemove', e => {
        mx = e.clientX; my = e.clientY;
        dot.style.left = mx + 'px';
        dot.style.top = my + 'px';
        this.spawnTrail(mx, my);
      });
      (function loop() {
        rx += (mx - rx) * 0.15;
        ry += (my - ry) * 0.15;
        ring.style.left = rx + 'px';
        ring.style.top = ry + 'px';
        requestAnimationFrame(loop);
      })();
      document.addEventListener('mouseover', e => {
        if (e.target.closest('.photo-card, .add-btn, .add-small, .arrow, .dot, button')) {
          ring.classList.add('hover');
        }
      });
      document.addEventListener('mouseout', e => {
        if (e.target.closest('.photo-card, .add-btn, .add-small, .arrow, .dot, button')) {
          ring.classList.remove('hover');
        }
      });
      // 点击波纹
      document.addEventListener('click', e => this.spawnRipple(e.clientX, e.clientY));
      this.initTrailCanvas();
    },
    trailParticles: [],
    ripples: [],
    initTrailCanvas() {
      const c = document.createElement('canvas');
      c.id = 'trailCanvas';
      c.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:99998;';
      document.body.appendChild(c);
      this.trailCtx = c.getContext('2d');
      const resize = () => { c.width = innerWidth; c.height = innerHeight; };
      resize(); window.addEventListener('resize', resize);
      const animate = () => {
        const ctx = this.trailCtx;
        ctx.clearRect(0, 0, c.width, c.height);
        // 粒子
        this.trailParticles = this.trailParticles.filter(p => {
          p.x += p.vx; p.y += p.vy;
          p.life -= 0.008;
          if (p.life <= 0) return false;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
          ctx.shadowBlur = 10;
          ctx.shadowColor = '#ff2020';
          ctx.fillStyle = `rgba(255,80,80,${p.life})`;
          ctx.fill();
          ctx.shadowBlur = 0;
          return true;
        });
        // 波纹
        this.ripples = this.ripples.filter(r => {
          r.r += 3;
          r.life -= 0.04;
          if (r.life <= 0) return false;
          ctx.beginPath();
          ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(255,60,60,${r.life * 0.8})`;
          ctx.lineWidth = 2;
          ctx.stroke();
          return true;
        });
        requestAnimationFrame(animate);
      };
      animate();
    },
    spawnTrail(x, y) {
      for (let i = 0; i < 8; i++) {
        this.trailParticles.push({
          x: x + (Math.random() - 0.5) * 20,
          y: y + (Math.random() - 0.5) * 20,
          vx: (Math.random() - 0.5) * 2,
          vy: (Math.random() - 0.5) * 2 - 0.5,
          size: Math.random() * 6 + 3,
          life: 1
        });
      }
    },
    spawnRipple(x, y) {
      this.ripples.push({ x, y, r: 5, life: 1 });
    },

    // ===== 照片3D倾斜 =====
    initTilt() {
      // 单张照片3D倾斜
      document.addEventListener('mousemove', e => {
        const card = e.target.closest('.photo-card');
        if (!card) return;
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left - rect.width / 2;
        const y = e.clientY - rect.top - rect.height / 2;
        const rotateY = (x / (rect.width / 2)) * 25;
        const rotateX = -(y / (rect.height / 2)) * 25;
        card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.05)`;
      });
      document.addEventListener('mouseout', e => {
        const card = e.target.closest('.photo-card');
        if (card) card.style.transform = '';
      });
    },

    // ===== IndexedDB 持久化存储 =====
    initDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open('photoAlbum', 2);
        req.onupgradeneeded = e => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('photos')) {
            db.createObjectStore('photos', { keyPath: 'id', autoIncrement: true });
          }
          if (!db.objectStoreNames.contains('moods')) {
            db.createObjectStore('moods', { keyPath: 'id', autoIncrement: true });
          }
        };
        req.onsuccess = e => { this.db = e.target.result; resolve(); };
        req.onerror = e => reject(e);
      });
    },
    loadPhotos() {
      return new Promise(resolve => {
        const tx = this.db.transaction('photos', 'readonly');
        const req = tx.objectStore('photos').getAll();
        req.onsuccess = () => { this.photos = req.result || []; resolve(); };
        req.onerror = () => resolve();
      });
    },
    loadMoods() {
      return new Promise(resolve => {
        const tx = this.db.transaction('moods', 'readonly');
        const req = tx.objectStore('moods').getAll();
        req.onsuccess = () => { this.moods = req.result || []; resolve(); };
        req.onerror = () => resolve();
      });
    },
    savePhoto(photo) {
      return new Promise(resolve => {
        const tx = this.db.transaction('photos', 'readwrite');
        const req = tx.objectStore('photos').add(photo);
        req.onsuccess = () => { photo.id = req.result; resolve(); };
      });
    },
    deletePhoto(i) {
      this.confirm = { show: true, index: i };
    },
    doDelete() {
      const i = this.confirm.index;
      const photo = this.photos[i];
      this.photos.splice(i, 1);
      if (photo && photo.id !== undefined && this.db) {
        this.db.transaction('photos', 'readwrite').objectStore('photos').delete(photo.id);
      }
      this.confirm.show = false;
    },

    // ===== 轮播 =====
    startBannerAuto() {
      this.bannerTimer = setInterval(() => this.nextBanner(), 4000);
    },
    nextBanner() { this.currentBanner = (this.currentBanner + 1) % this.banners.length; },
    prevBanner() { this.currentBanner = (this.currentBanner - 1 + this.banners.length) % this.banners.length; },
    goBanner(i) { this.currentBanner = i; },

    // ===== 添加照片 =====
    scrollToMood() {
      document.querySelector('.mood-section').scrollIntoView({ behavior: 'smooth' });
    },
    triggerAdd() { this.$refs.fileInput.click(); },
    onFiles(e) {
      const files = Array.from(e.target.files);
      files.forEach(f => {
        const reader = new FileReader();
        reader.onload = ev => {
          const photo = { src: ev.target.result, name: f.name.replace(/\.[^.]+$/, ''), createdAt: Date.now() };
          this.photos.push(photo);
          this.savePhoto(photo); // 持久化到 IndexedDB
        };
        reader.readAsDataURL(f);
      });
      e.target.value = '';
    },

    // ===== 灯箱 =====
    // ===== 时光心事 =====
    onMoodImage(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => { this.moodImage = ev.target.result; };
      reader.readAsDataURL(file);
      e.target.value = '';
    },
    addMood() {
      if (!this.moodText.trim() && !this.moodImage) return;
      const mood = { text: this.moodText.trim(), img: this.moodImage, createdAt: Date.now() };
      this.moods.unshift(mood);
      const tx = this.db.transaction('moods', 'readwrite');
      const req = tx.objectStore('moods').add(mood);
      req.onsuccess = () => { mood.id = req.result; };
      this.moodText = '';
      this.moodImage = '';
    },
    editMood(i) {
      this.editingMood = i;
      this.moodEditText = this.moods[i].text;
      this.moodEditImg = this.moods[i].img || '';
    },
    onMoodEditImage(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => { this.moodEditImg = ev.target.result; };
      reader.readAsDataURL(file);
      e.target.value = '';
    },
    saveMood(i) {
      const mood = { ...this.moods[i] };
      mood.text = this.moodEditText;
      if (this.moodEditImg) mood.img = this.moodEditImg;
      this.moods.splice(i, 1, mood);
      if (mood.id !== undefined) {
        this.db.transaction('moods', 'readwrite').objectStore('moods').put(mood);
      }
      this.editingMood = -1;
      this.moodEditImg = '';
    },
    openImgLightbox(src) {
      this.moodLightbox = { show: true, src };
    },
    deleteMood(i) {
      const mood = this.moods[i];
      this.moods.splice(i, 1);
      if (mood && mood.id !== undefined && this.db) {
        this.db.transaction('moods', 'readwrite').objectStore('moods').delete(mood.id);
      }
      this.editingMood = -1;
    },
    formatTime(ts) {
      if (!ts) return '';
      const d = new Date(ts);
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      const h = String(d.getHours()).padStart(2, '0');
      const min = String(d.getMinutes()).padStart(2, '0');
      return `${d.getFullYear()}-${m}-${day} ${h}:${min}`;
    },
    openLightbox(i) { this.lightbox = { show: true, index: i }; },
    closeLightbox() { this.lightbox.show = false; },
    lightboxPrev() { this.lightbox.index = (this.lightbox.index - 1 + this.photos.length) % this.photos.length; },
    lightboxNext() { this.lightbox.index = (this.lightbox.index + 1) % this.photos.length; },

    // ===== 背景音乐（隐藏播放器，自动循环） =====
    tryPlayBgm() {
      const audio = this.$refs.bgm;
      if (!audio) return;
      audio.volume = 0.5;
      // 浏览器限制自动播放，首次用户交互时尝试播放
      const play = () => {
        audio.play().catch(() => {});
        document.removeEventListener('click', play);
        document.removeEventListener('keydown', play);
      };
      audio.play().catch(() => {
        document.addEventListener('click', play);
        document.addEventListener('keydown', play);
      });
    },

    // ===== 星星粒子 =====
    initStars() {
      const canvas = document.getElementById('stars');
      const ctx = canvas.getContext('2d');
      let stars = [];
      const resize = () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      };
      resize();
      window.addEventListener('resize', resize);
      for (let i = 0; i < 150; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          r: Math.random() * 1.5 + 0.5,
          speed: Math.random() * 0.4 + 0.08,
          opacity: Math.random() * 0.8 + 0.2
        });
      }
      const animate = () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        stars.forEach(s => {
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255,255,255,${s.opacity})`;
          ctx.fill();
          s.y -= s.speed;
          if (s.y < -5) { s.y = canvas.height + 5; s.x = Math.random() * canvas.width; }
        });
        requestAnimationFrame(animate);
      };
      animate();
    }
  }
}).mount('#app');
</script>
